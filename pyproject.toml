[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentnave"
version = "0.59.1"
description = "Local MCP server for CLI-based subagents with saved, reviewable multi-CLI meetings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.1.1,<3"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
]

[project.urls]
Repository = "https://github.com/TimWongUp/agentnave"
Issues = "https://github.com/TimWongUp/agentnave/issues"

[project.scripts]
agentnave-mcp = "agentnave.relay:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentnave"]

[tool.hatch.build.targets.wheel.force-include]
"skills/agentnave-manager" = "agentnave/skills/agentnave-manager"
"skills/agentnave-review" = "agentnave/skills/agentnave-review"

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
