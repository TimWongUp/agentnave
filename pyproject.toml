[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentnave"
version = "0.3.0"
description = "Local MCP server for CLI-based subagents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.1.1,<3"]
classifiers = ["Operating System :: POSIX"]

[project.urls]
Repository = "https://github.com/TimWongUp/agentnave"
Issues = "https://github.com/TimWongUp/agentnave/issues"

[project.scripts]
agentnave-mcp = "agentnave.mcp_server:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentnave"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
