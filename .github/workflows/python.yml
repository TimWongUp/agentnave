name: Python

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Verify installed launcher
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/agentnave-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/agentnave-bin
        run: |
          uv tool install --python 3.12 dist/*.whl
          test -x "$UV_TOOL_BIN_DIR/agentnave-mcp"
          "$UV_TOOL_BIN_DIR/agentnave-mcp" </dev/null
