name: Python

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify paired source archive
        run: |
          python - <<'PY'
          import io
          import subprocess
          import tarfile

          skill = "skills/agentnave-manager"
          required = ["pyproject.toml", "src/agentnave/__init__.py", f"{skill}/SKILL.md",
                      "src/agentnave/mcp_server.py", "src/agentnave/conversations.py",
                      f"{skill}/references/studio.md"]
          required += [f"{skill}/references/{name}.md" for name in
                       ("claude", "codebuddy", "codex", "grok", "antigravity", "pi", "deepseek")]
          archive = subprocess.check_output(["git", "archive", "--format=tar", "HEAD", "--", *required])
          with tarfile.open(fileobj=io.BytesIO(archive)) as source:
              for name in required:
                  member = source.getmember(name)
                  assert member.isfile() and member.size > 0, f"Missing source content: {name}"
          PY
      - name: Check version change and release notes
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Releases require a stable MAJOR.MINOR.PATCH version")
          def runtime_version(path: str) -> list[object]:
              module = ast.parse(Path(path).read_text())
              return [
                  ast.literal_eval(node.value)
                  for node in module.body
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              ]

          if runtime_version("src/agentnave/__init__.py") != [version]:
              raise SystemExit("pyproject.toml and agentnave.__version__ must match")
          previous = tomllib.loads(subprocess.check_output(
              ["git", "show", f"{os.environ['BASE_SHA']}:pyproject.toml"], text=True
          ))["project"]["version"]
          changed = version != previous
          if changed:
              if tuple(map(int, version.split("."))) <= tuple(map(int, previous.split("."))):
                  raise SystemExit("A release version must increase")
              notes = Path(f"docs/releases/v{version}.md")
              if not notes.is_file() or not notes.read_text().strip():
                  raise SystemExit(f"Missing release notes: {notes}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={str(changed).lower()}\ntag=v{version}\n")
          print(f"{previous} -> {version}; release required: {changed}")
          PY

  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Verify installed distributions
        if: runner.os != 'Windows'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/agentnave-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/agentnave-bin
        run: |
          uv tool install --python 3.12 dist/agentnave-*.whl
          # The retired launcher must be absent; verify_install treats its path as an absence check.
          "$UV_TOOL_DIR/agentnave/bin/python" scripts/verify_install.py \
            "$UV_TOOL_BIN_DIR/agentnave-mcp" "$UV_TOOL_BIN_DIR/agentnave-studio-mcp"
      - name: Verify installed distributions on Windows
        if: runner.os == 'Windows'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}\agentnave-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\agentnave-bin
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter "agentnave-*.whl" -File -ErrorAction Stop).FullName
          uv tool install --python 3.12 $wheel
          $python = Join-Path $env:UV_TOOL_DIR "agentnave\Scripts\python.exe"
          & $python scripts/verify_install.py (Join-Path $env:UV_TOOL_BIN_DIR "agentnave-mcp.exe") (Join-Path $env:UV_TOOL_BIN_DIR "agentnave-studio-mcp.exe")
          if ($LASTEXITCODE -ne 0) { throw "Installed distribution verification failed" }

  release:
    name: Publish version release
    needs: [release-metadata, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-metadata.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_exists=true
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "Refusing to move an existing release tag: $RELEASE_TAG" >&2
              exit 1
            }
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$tag_exists" = true || {
              echo "An existing release has no tag: $RELEASE_TAG" >&2
              exit 1
            }
            test "$draft" = false || {
              echo "An existing draft requires manual review: $RELEASE_TAG" >&2
              exit 1
            }
            echo "Release already published: $RELEASE_TAG"
          else
            if [ "$tag_exists" = false ]; then
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "AgentNave $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi

  tray-release:
    name: Attach macOS tray app
    needs: [release-metadata, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-metadata.outputs.changed == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: tray-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build signed universal app
        working-directory: apps/tray
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          }
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx --yes @tauri-apps/cli@2.12.3 build --target universal-apple-darwin \
            --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Upload installer, update archive and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          bundle=apps/tray/target/universal-apple-darwin/release/bundle
          mkdir -p tray-assets
          cp "$bundle/macos/AgentNave.app.tar.gz" tray-assets/AgentNave_universal.app.tar.gz
          cp "$bundle"/dmg/*.dmg "tray-assets/AgentNave_${RELEASE_TAG#v}_universal.dmg"
          python3 - "$bundle/macos/AgentNave.app.tar.gz.sig" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          tag, repo = os.environ["RELEASE_TAG"], os.environ["GH_REPO"]
          entry = {
              "signature": open(sys.argv[1]).read().strip(),
              "url": f"https://github.com/{repo}/releases/download/{tag}/AgentNave_universal.app.tar.gz",
          }
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": entry, "darwin-x86_64": entry},
          }
          with open("tray-assets/latest.json", "w") as output:
              json.dump(manifest, output, indent=2)
          PY
          gh release upload "$RELEASE_TAG" tray-assets/* --clobber
