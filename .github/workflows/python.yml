name: Python

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Verify installed distribution
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/agentnave-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/agentnave-bin
        run: |
          uv tool install --python 3.12 dist/*.whl
          test -x "$UV_TOOL_BIN_DIR/agentnave-mcp"
          "$UV_TOOL_DIR/agentnave/bin/python" - <<'PY'
          import asyncio
          import os
          from importlib.resources import files
          from pathlib import Path

          from mcp import Client, StdioServerParameters


          async def verify() -> None:
              skill = files("agentnave.resources").joinpath(
                  "agentnave-manager", "SKILL.md"
              )
              assert skill.is_file(), "installed wheel is missing agentnave-manager/SKILL.md"

              launcher = Path(os.environ["UV_TOOL_BIN_DIR"]) / "agentnave-mcp"
              parameters = StdioServerParameters(command=str(launcher))
              async with Client(parameters) as client:
                  result = await client.list_tools()

              assert [tool.name for tool in result.tools] == [
                  "start_agent",
                  "wait_agent",
                  "cancel_agent",
              ]


          asyncio.run(verify())
          PY
