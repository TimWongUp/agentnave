name: Tray

on:
  push:
    branches:
      - main
    paths:
      - "apps/tray/**"
      - "src/agentnave/**"
      - "skills/**"
      - ".github/workflows/tray.yml"
  pull_request:
    paths:
      - "apps/tray/**"
      - "src/agentnave/**"
      - "skills/**"
      - ".github/workflows/tray.yml"

permissions:
  contents: read

jobs:
  check:
    name: Tray / macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  windows:
    name: Tray / windows-latest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup component add clippy
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked
      - name: Build installer
        if: ${{ !cancelled() }}
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentnave-windows-installer
          path: apps/tray/target/release/bundle/nsis/*.exe
          if-no-files-found: error
