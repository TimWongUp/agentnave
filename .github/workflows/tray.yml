name: Tray

on:
  push:
    branches:
      - main
    paths:
      - "apps/tray/**"
      - "src/agentnave/**"
      - "skills/**"
      - ".github/workflows/tray.yml"
  pull_request:
    paths:
      - "apps/tray/**"
      - "src/agentnave/**"
      - "skills/**"
      - ".github/workflows/tray.yml"

permissions:
  contents: read

# A newer push to a pull request replaces its unfinished run; main runs each commit to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tray / macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tray
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  windows:
    name: Tray / windows-latest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/tray
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked
      - name: Build Windows preview
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          AGENTNAVE_PREVIEW: "1"
          TAURI_CONFIG: '{"identifier":"io.github.timwongup.agentnave.preview","productName":"AgentNave 预览"}'
        run: cargo rustc --locked --bin agentnave-tray -- -C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup
      - name: Upload Windows preview
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentnave-windows-preview
          path: apps/tray/target/debug/agentnave-tray.exe
          if-no-files-found: error
      # Pull requests stop at tests; main still proves the installer builds.
      - name: Build installer
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis
      - name: Upload installer
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentnave-windows-installer
          path: apps/tray/target/release/bundle/nsis/*.exe
          if-no-files-found: error
