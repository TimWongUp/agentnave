    <rect x="64" y="52" width="76" height="58" rx="16" fill="#232820" stroke="#9cff00" stroke-opacity="0.3"/>
    <image href="tim-wong-mark.png" x="72" y="57" width="60" height="48" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <text x="88" y="240" fill="#f3f5ef" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="760" letter-spacing="-3">AgentNave</text>
  <text x="92" y="308" fill="#b8c2bb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="520">A thin local bridge to CLI subagents.</text>

  <g transform="translate(92 374)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">
    <rect width="132" height="46" rx="23" fill="#9cff00" opacity="0.13"/>
    <text x="66" y="30" text-anchor="middle" fill="#b8ff51">STDIO MCP</text>
    <rect x="144" width="156" height="46" rx="23" fill="#50cbed" opacity="0.13"/>
    <text x="222" y="30" text-anchor="middle" fill="#7bdcf5">Native sessions</text>
    <rect x="312" width="164" height="46" rx="23" fill="#ffffff" opacity="0.07"/>
    <text x="394" y="30" text-anchor="middle" fill="#d3d9d4">Agent-managed</text>
  </g>

