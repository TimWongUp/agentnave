<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AgentNave</title>
  <desc id="desc">A thin local bridge from Agent Managers to CLI subagents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111815"/>
      <stop offset="1" stop-color="#1d2924"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cff00"/>
      <stop offset="1" stop-color="#50cbed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="48" fill="url(#background)"/>
  <circle cx="1130" cy="72" r="230" fill="#9cff00" opacity="0.045"/>
  <circle cx="1010" cy="646" r="330" fill="#50cbed" opacity="0.045"/>
  <path d="M0 530C210 488 347 565 544 528s334-9 484 35 188 28 252 7v70H0Z" fill="#ffffff" opacity="0.025"/>

  <g transform="rotate(-2 102 81)">
