[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentnave-studio"
version = "0.14.0"
description = "AgentNave with saved history, answer review and a local dashboard for multi-CLI shows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["agentnave==0.14.0"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
]

[project.urls]
Repository = "https://github.com/TimWongUp/agentnave"
Issues = "https://github.com/TimWongUp/agentnave/issues"

[project.scripts]
agentnave-studio-mcp = "agentnave_studio.mcp_server:main"

[tool.uv.sources]
agentnave = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agentnave_studio"]
