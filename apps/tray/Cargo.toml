[package]
name = "agentnave-tray"
version = "0.59.1"
description = "AgentNave menu bar and tray app: view and clean up saved Studio conversations"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
# Explicit local validation: reads installed hosts/shims and locks the real service pointer.
windows-live-tests = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
flate2 = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ruzstd = "0.8"
sha2 = "0.10"
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tempfile = "3"
toml = "1.1"
toml_edit = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
