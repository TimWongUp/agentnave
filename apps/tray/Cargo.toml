[package]
name = "agentnave-tray"
version = "0.53.0"
description = "AgentNave menu bar and tray app: view and clean up saved Studio conversations"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dirs = "6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tempfile = "3"
toml = "1.1"
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
