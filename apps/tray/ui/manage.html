<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>管理会话 · AgentNave</title>
<link rel="stylesheet" href="./manage.css">
<script src="./manage.js" defer></script>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="/chat/"><span class="mark">N</span>AgentNave</a>
    <nav class="nav" aria-label="主导航">
      <a href="/chat/">群聊</a>
      <a href="/manage/" aria-current="page">管理会话</a>
      <a href="/settings/">设置</a>
    </nav>
  </header>
  <section class="intro">
    <div><p class="eyebrow">本机工作室 · 会话记录</p><h1>管理会话<span id="total">—</span></h1></div>
    <p class="scope">只清除会话历史与视图。<br>席位目录、生成文件和原生会话均保留。</p>
  </section>
  <div id="notice" role="status" aria-live="polite">正在读取会话…</div>
  <section class="tools" aria-label="筛选与清理">
    <div class="filters">
      <label>查看 <select id="filter"><option value="all">全部会话</option><option value="archived">已结束</option><option value="idle">空闲</option><option value="failed">失败 / 受阻 / 中断</option></select></label>
      <label>活动早于 <input id="before" type="date" aria-label="最近活动早于日期"></label>
    </div>
    <div class="cleanup">
      <button id="refresh" type="button">刷新列表</button>
      <label><input id="days" type="number" min="1" max="36500" value="30" aria-label="清理多少天前的会话"> 天前</label>
      <button id="cleanup" type="button">清理旧会话…</button>
    </div>
  </section>
  <section id="confirmation" class="confirmation" aria-label="确认删除会话" tabindex="-1" hidden>
    <h2 id="confirm-title"></h2>
    <p>删除后无法恢复记录，空闲会话即使主控没有结束也会被删除。席位中的文件会保留。</p>
    <ul id="confirm-list"></ul>
    <div class="confirm-actions"><button id="cancel" type="button">取消</button><button id="confirm" class="danger" type="button">确认删除</button></div>
  </section>
  <section class="records" aria-label="会话列表">
    <div class="selection"><label><input id="select-all" type="checkbox">全选当前列表中可删除的会话</label><button id="delete" class="danger" type="button" disabled>删除所选…</button></div>
    <div class="table-wrap"><table><thead><tr><th class="check"><span class="sr-only">选择</span></th><th>会话 / 类型</th><th>状态</th><th>最近活动</th><th>备注</th></tr></thead><tbody id="list"></tbody></table></div>
    <p id="empty" class="empty" hidden>没有符合条件的会话</p>
    <p class="hint">运行中与待审核的会话不可选择。锁已释放的崩溃残留会标为中断，可直接清理。</p>
  </section>
  <section id="results" class="results" aria-live="polite" hidden><h2>本次删除结果</h2><ul id="result-list"></ul></section>
  <details id="unavailable" hidden><summary>无法读取的记录</summary><ul id="unavailable-list"></ul></details>
</main>
</body>
</html>
