<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>AgentNave</title>
<link rel="stylesheet" href="/panel/panel.css">
<link rel="stylesheet" href="/panel/onboarding.css">
<script src="/avatars.js" defer></script>
<script src="/panel/common.js" defer></script>
<script src="/panel/mock.js" defer></script>
<script src="/panel/panel.js" defer></script>
</head>
<body>
<header class="top">
  <span class="brand"><span class="mark"><svg viewBox="0 0 44 44" aria-hidden="true"><path class="stem" d="M10 35V10L32 35V20"/><ellipse class="drop" cx="32" cy="10" rx="4" ry="4"/></svg></span>AgentNave</span>
  <span id="state" class="state-row" aria-live="off"></span>
  <span class="top-end"></span>
</header>
<div id="notices" class="notices"></div>
<main id="scroll">
  <a id="ask" class="ask" hidden></a>
  <div id="stage" hidden>
    <div class="sec" id="sec-live">boss 与办公室<span class="r" id="live-count"></span></div>
    <div id="groups" class="groups"></div>
    <div class="sec" id="sec-quiet">最近没有动静<span class="r" id="quiet-count"></span></div>
    <div id="quiet" class="quiet"></div>
  </div>
  <div id="ob-slot" class="ob-slot" hidden><p class="ob-note">在宿主里派出任务后，boss 和它的办公室会出现在这里。</p></div>
  <div id="calm" class="calm" hidden></div>
</main>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>
<footer class="foot">
  <a class="open" href="/chat/">打开 AgentNave</a>
  <button class="btn ico" id="more" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"><span aria-hidden="true">⋯</span><i class="more-dot" hidden></i></button>
  <div class="menu" id="menu" role="menu" hidden>
    <a href="/settings/" role="menuitem">设置…</a>
    <a id="update" href="/app/update" role="menuitem">检查更新</a>
    <hr>
    <a href="/app/quit" role="menuitem">退出 AgentNave</a>
  </div>
</footer>
</body>
</html>
