<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>AgentNave</title>
<link rel="stylesheet" href="/manage/theme.css">
<link rel="stylesheet" href="/panel/voice-menu.css">
<link rel="stylesheet" href="/panel/panel.css">
<script src="/avatars.js" defer></script>
<script src="/panel/appearance.js" defer></script>
<script src="/panel/common.js" defer></script>
<script src="./provider-health.js" defer></script>
<script src="/panel/common-select.js" defer></script>
<script src="/panel/update-dialog.js" defer></script>
<script src="/panel/common-status.js" defer></script>
<script src="/panel/voice-menu.js" defer></script>
<script src="/panel/panel.js" defer></script>
</head>
<body>
<header class="top">
  <span class="brand"><span class="mark"><svg viewBox="0 0 44 44" aria-hidden="true"><path class="stem" d="M10 35V10L32 35V20"/><ellipse class="drop" cx="32" cy="10" rx="4" ry="4"/></svg></span>AgentNave</span>
  <span id="state" class="state-row" aria-live="off"></span>
  <span class="top-end"></span>
</header>
<a id="provider-health-alert" class="provider-health-alert" href="/settings/#members" hidden></a>
<div id="notices" class="notices"></div>
<main id="scroll">
  <div id="stage" hidden>
    <div class="sec" id="sec-live" data-en="Working">工作中<span class="r" id="live-count"></span></div>
    <div id="groups" class="groups"></div>
    <div class="sec" id="sec-quiet" data-en="Idle">空闲<span class="r" id="quiet-count"></span></div>
    <div id="quiet" class="quiet"></div>
  </div>
  <div id="calm" class="calm" hidden></div>
</main>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>
<footer class="foot">
  <a class="open" href="/chat/" data-en="Open AgentNave">打开 AgentNave</a>
  <a class="btn ico" href="/settings/" aria-label="设置" data-en-label="Settings" title="设置" data-en-title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a>
  <a class="btn" href="/app/quit" data-en="Quit">退出</a>
</footer>
</body>
</html>
