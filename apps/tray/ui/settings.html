<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>设置 · AgentNave</title>
<link rel="stylesheet" href="/manage/manage.css">
<link rel="stylesheet" href="./settings.css">
<script src="./settings.js" defer></script>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="/"><span class="mark">N</span>AgentNave <span class="back">/ 设置</span></a>
    <nav aria-label="页面导航">
      <a href="/manage/">管理会话 ↗</a>
    </nav>
  </header>

  <section class="intro">
    <div>
      <p class="eyebrow">本机偏好 · 托盘管理</p>
      <h1>设置</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="设置分区">
      <button id="tab-members" class="tab-btn active" role="tab" aria-selected="true" type="button">执行者与模型</button>
      <button id="tab-updates" class="tab-btn" role="tab" aria-selected="false" type="button">版本与更新<span id="update-badge" class="badge-dot" hidden></span></button>
    </div>
  </section>

  <div id="notice" role="status" aria-live="polite">正在读取设置…</div>

  <div id="error-banner" class="banner error" hidden>
    <div class="banner-content">
      <strong id="error-title">配置文件存在错误</strong>
      <p id="error-desc"></p>
    </div>
  </div>

  <!-- 分区 1：执行者与模型 -->
  <section id="pane-members" class="tab-pane active" role="tabpanel" aria-labelledby="tab-members">
    <div id="migration-banner" class="banner migration" hidden>
      <div class="banner-content">
        <strong id="migration-title">已将原编排档案的模型与说明迁移；两种模式当前未限制，如需限制再开启</strong>
        <div id="migration-skipped-container"></div>
      </div>
      <button id="dismiss-migration" type="button">我知道了</button>
    </div>

    <div class="members-toolbar">
      <div class="mode-control">
        <div class="segment-control" role="radiogroup" aria-label="编排模式">
          <button id="mode-task" class="segment-btn active" role="radio" aria-checked="true" type="button">任务</button>
          <button id="mode-discussion" class="segment-btn" role="radio" aria-checked="false" type="button">讨论</button>
        </div>
        <div class="mode-restrict-wrap">
          <label class="restrict-toggle-label">
            <input type="checkbox" id="mode-restrict-toggle">
            <span id="mode-restrict-title">限制此模式</span>
          </label>
          <span id="mode-restrict-hint" class="mode-hint">未限制：所有 CLI 都可用</span>
        </div>
      </div>
      <button id="refresh-detection" type="button">刷新检测</button>
    </div>

    <p class="guidance">参数是否有效以主控读取时（list_members）的校验为准；主控没指定模型和努力程度时，会使用这里的默认值。</p>

    <!-- 6 个 Provider 卡片容器 -->
    <div id="cli-cards" class="cli-cards"></div>

    <!-- 底部固定保存条 -->
    <aside class="sticky-save-bar">
      <div class="save-bar-inner">
        <div class="save-bar-info">
          <span id="dirty-text" class="dirty-label"></span>
          <span id="permission-summary" class="permission-summary-tag" hidden></span>
          <span id="save-feedback" class="save-feedback"></span>
        </div>
        <div class="save-bar-actions">
          <button id="save-btn" class="primary" type="button" disabled>保存设置</button>
        </div>
      </div>
    </aside>
  </section>

  <!-- 分区 2：版本与更新 -->
  <section id="pane-updates" class="tab-pane" role="tabpanel" aria-labelledby="tab-updates" hidden>
    <div class="updates-panel">
      <div class="updates-card">
        <h2>应用与服务状态</h2>
        <div class="status-grid">
          <div class="status-item">
            <span class="status-label">AgentNave 托盘应用</span>
            <div class="status-val-wrap">
              <strong id="app-version" class="status-value">—</strong>
              <span id="app-badge" class="tag" hidden></span>
            </div>
          </div>
          <div class="status-item">
            <span class="status-label">本机服务 (agentnave)</span>
            <div class="status-val-wrap">
              <strong id="service-version" class="status-value">—</strong>
              <span id="service-badge" class="tag" hidden></span>
            </div>
            <p id="service-msg" class="status-desc" hidden></p>
          </div>
          <div class="status-item full-width">
            <span class="status-label">上次检查时间</span>
            <span id="last-checked" class="status-value status-time">—</span>
          </div>
        </div>

        <div id="update-action-area" class="update-action-area">
          <div class="btn-group">
            <button id="btn-check-update" class="primary" type="button">检查更新</button>
            <button id="btn-apply-update" class="accent-btn" type="button" hidden>全部更新</button>
          </div>
          <p id="update-hint" class="field-hint" hidden>会先更新 App 并自动重启，重启后自动升级本机服务。</p>
          <div id="update-progress-box" class="progress-box" hidden>
            <span class="spinner-dot"></span>
            <span id="update-progress-text">正在检查更新…</span>
          </div>
          <div id="update-error-box" class="update-error" role="status" aria-live="polite" hidden>
            <span id="update-error-text"></span>
            <button id="btn-retry-update" type="button">重试</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
