<!doctype html>
<html lang="zh-CN" data-idle-blur>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title data-en="AgentNave · Office">AgentNave · 办公室</title>
<link rel="stylesheet" href="/manage/theme.css">
<link rel="stylesheet" href="/manage/manage.css">
<link rel="stylesheet" href="/chat/chat.css">
<link rel="stylesheet" href="/chat/voice-menu.css">
<link rel="stylesheet" href="/chat/onboarding.css">
<script src="/avatars.js" defer></script>
<script src="/chat/appearance.js" defer></script>
<script src="/chat/common.js" defer></script>
<script src="./provider-health.js" defer></script>
<script src="/chat/common-select.js" defer></script>
<script src="/chat/update-dialog.js" defer></script>
<script src="/chat/common-status.js" defer></script>
<script src="/chat/onboarding-steps.js" defer></script>
<script src="/chat/onboarding.js" defer></script>
<script src="/chat/actions.js" defer></script>
<script src="/chat/office-settings.js" defer></script>
<script src="/chat/voice-menu.js" defer></script>
<script src="/chat/voice.js" defer></script>
<script src="/chat/chat-topics.js" defer></script>
<script src="/chat/chat-groups.js" defer></script>
<script src="/chat/chat-sidebar.js" defer></script>
<script src="/chat/chat-state.js" defer></script>
<script src="/chat/laptop.js" defer></script>
<script src="/chat/chat-usage.js" defer></script>
<script src="/chat/chat-office.js" defer></script>
<script src="/chat/chat-messages.js" defer></script>
<script src="/chat/chat-terminal.js" defer></script>
<script src="/chat/chat-git-ops.js" defer></script>
<script src="/chat/chat-git.js" defer></script>
<script src="/chat/chat-isolated-cleanup.js" defer></script>
<script src="/chat/chat.js" defer></script>
</head>
<body class="chat-page">
<header class="bar">
  <div class="bar-start">
    <button id="side-toggle" class="bar-toggle side-toggle" type="button" aria-controls="side"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M8 4v12"/><rect class="pane" x="3.3" y="4.8" width="4" height="10.4" rx="1.4"/></svg></button>
    <a draggable="false" class="brand" href="/chat/"><span class="mark"><svg viewBox="0 0 44 44" aria-hidden="true"><path class="stem" d="M10 35V10L32 35V20"/><ellipse class="drop" cx="32" cy="10" rx="4" ry="4"/></svg></span>AgentNave</a>
  </div>
  <nav class="nav" aria-label="主导航" data-en-label="Main navigation">
    <a draggable="false" href="/chat/" aria-current="page" data-en="Office">办公室</a>
    <a draggable="false" href="/usage/" data-en="Usage">用量</a>
    <a draggable="false" href="/settings/" data-en="Settings">设置</a>
  </nav>
  <button id="conv-toggle" class="bar-toggle conv-toggle" type="button" aria-controls="drawer" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M12 4v12"/><rect class="pane" x="12.7" y="4.8" width="4" height="10.4" rx="1.4"/></svg></button>
</header>
<div id="provider-health-alert" class="provider-health-alert" hidden><a class="provider-health-lines" href="/settings/#members"></a><button class="provider-health-close" type="button" aria-label="关闭" data-en-label="Close" title="关闭" data-en-title="Close">×</button></div>
<div id="banner" class="banner" role="status" hidden data-en="Connection interrupted, retrying…">读取中断，正在重试…</div>
<div id="app" class="app" data-view="list">
  <aside id="side" class="side" aria-label="项目列表" data-en-label="Projects">
    <div class="side-head"><div id="side-search" class="side-search"><span class="side-search-ico" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L13.5 13.5"/></svg></span><input id="side-search-input" class="side-search-input" type="text" placeholder="搜索" aria-label="搜索" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"><button id="side-search-clear" class="side-search-clear" type="button" hidden aria-label="清除搜索" data-en-label="Clear search" title="清除" data-en-title="Clear">×</button></div><div class="side-head-end"><button id="side-view-btn" class="side-icon-btn" type="button" aria-label="排序与筛选" data-en-label="Sort and filter" title="排序与筛选" data-en-title="Sort and filter" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3"/></svg></button><button id="add-project" class="side-icon-btn" type="button" aria-label="新建项目" data-en-label="New project" title="新建项目" data-en-title="New project"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 4.5a1.3 1.3 0 0 1 1.3-1.3h2.6l1.3 1.4h5.1a1.3 1.3 0 0 1 1.3 1.3v5.8a1.3 1.3 0 0 1-1.3 1.3h-9a1.3 1.3 0 0 1-1.3-1.3V4.5Z"/><path d="M8 7v3.6M6.2 8.8h3.6"/></svg></button><button id="new-chat" class="side-icon-btn" type="button" aria-label="新建聊天" data-en-label="New chat" title="新建聊天" data-en-title="New chat"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5H4a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 4 13.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5"/><path d="M11.6 2.1a1.3 1.3 0 0 1 1.8 1.8L8.2 9.1l-2.3.5.5-2.3 5.2-5.2Z"/></svg></button><button id="side-more-btn" class="side-icon-btn" type="button" aria-label="更多操作" data-en-label="More actions" title="更多操作" data-en-title="More actions" aria-haspopup="menu" aria-expanded="false">⋯</button></div></div>
    <div class="gl-wrap"><div id="list" class="gl"></div></div>
    <div class="split split-side" data-split="side" role="separator" aria-orientation="vertical" aria-label="调整项目列表宽度" data-en-label="Resize project list" tabindex="0"></div>
  </aside>
  <main id="pane" class="floor-wrap">
    <header id="head" class="floor-head" hidden></header>
    <div id="office" class="office" hidden>
      <div id="floor" class="floor">
        <section id="boss" class="zone boss-zone" aria-label="boss 办公室" data-en-label="boss office"></section>
        <div id="rooms" class="rooms"></div>
        <section class="zone wide desks-zone" aria-labelledby="desks-title">
          <h2 class="zone-h" id="desks-title" data-en="Open desks">开放工位<span id="desks-count" class="zone-count"></span></h2>
          <div id="desks" class="desks"></div>
        </section>
        <div id="fx" class="fx" aria-hidden="true"></div>
      </div>
    </div>
    <div id="blank" class="blank" hidden><div id="blank-note" class="blank-note"></div><section id="onboarding" class="onboarding" aria-labelledby="ob-title" hidden></section></div>
    <footer id="ticker" class="ticker" hidden><span class="lbl" data-en="Live">动态</span><span id="tick" class="tick"></span></footer>
  </main>
  <aside id="drawer" class="conv tp-im" aria-label="对话" data-en-label="Conversation" hidden>
    <div class="split split-conv" data-split="conv" role="separator" aria-orientation="vertical" aria-label="调整对话栏宽度" data-en-label="Resize conversation drawer" tabindex="0"></div>
    <header class="conv-head">
      <span id="dr-ico" class="dr-ico" aria-hidden="true"></span>
      <div class="dr-id"><b id="dr-title" class="dr-title"></b><span id="dr-sub" class="dr-sub"></span></div>
      <button id="dr-all" class="dr-all" type="button" hidden data-en="‹ All">‹ 全部</button>
      <button id="dr-close" class="dr-close" type="button" aria-label="关闭对话栏" data-en-label="Close conversation drawer">×</button>
    </header>
    <section id="voice-actions" class="voice-channel" aria-label="语音频道" data-en-label="Voice channel" hidden></section>
    <div id="timeline" class="tl" role="log" aria-label="消息" data-en-label="Messages" tabindex="0"><div id="tl-inner" class="tl-inner"></div></div>
    <button id="jump" class="jump" type="button" hidden data-en="New messages ↓">有新消息 ↓</button>
  </aside>
</div>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
